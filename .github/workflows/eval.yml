name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_to_confident:
        description: Upload this run to Confident AI (needs the CONFIDENT_API_KEY secret)
        type: boolean
        default: false
  schedule:
    - cron: "0 14 * * 1" # Mondays, 14:00 UTC

concurrency:
  group: eval-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

jobs:
  unit:
    name: unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  eval:
    name: DeepEval (${{ github.event_name == 'pull_request' && 'smoke subset' || 'full suite' }})
    needs: unit
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEEPEVAL_RESULTS_FOLDER: results
      EVENT_NAME: ${{ github.event_name }}
      # gpt-5-mini judgings average about 33 s and DeepEval's default 180 s per case covers every metric of the case; a timeout still fails the case.
      DEEPEVAL_PER_TASK_TIMEOUT_SECONDS_OVERRIDE: "600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, so the step below can diff against the base branch
      # Lists the files this pull request changes, for the job summary's notice when it touches the
      # gate itself (GATE_PATHS in evals/report.py). The list is moved into place only if git
      # succeeded, so a failure leaves no file and the summary says it could not list the files
      # instead of showing an empty list. --no-renames lists both paths of a moved file, so moving
      # a gate file out of the gate's paths is still seen. core.quotePath=false keeps git from
      # quoting a path with non-ASCII characters, which would not match a gate directory. The base
      # branch comes through env, never into the script.
      - name: List the changed files
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git -c core.quotePath=false diff --name-only --no-renames "origin/$BASE_REF...HEAD" > changed-files.tmp
          mv changed-files.tmp changed-files.txt
      # Fails closed: without keys the check is red, including on fork pull requests, so a run
      # that never scored the app cannot pass the required check (tests/test_check_eval_keys.py).
      - name: Check for API keys
        id: keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash .github/scripts/check-eval-keys.sh
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.keys.outputs.available == 'true'
        with:
          enable-cache: true
      - name: Install
        if: steps.keys.outputs.available == 'true'
        run: uv sync --frozen
      - name: Run DeepEval
        id: run
        if: steps.keys.outputs.available == 'true'
        # Pull requests are gated by the smoke subset. The full run (manual or weekly) is a
        # report-only trend signal: failing metrics show up in the summary, not as a red job. A
        # full run that scored no case is red through the summary step below.
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONFIDENT_API_KEY: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_confident)) && secrets.CONFIDENT_API_KEY || '' }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            uv run deepeval test run evals/ -m smoke
          else
            uv run deepeval test run evals/
          fi
      # The summary opens with the gate verdict. RUN_OUTCOME is the outcome of the step above taken
      # before continue-on-error applies, so a run that failed outside the scored metrics is not
      # summarised as passed. Only pull requests are gated; the full run reports a trend.
      # On a pull request the "Run DeepEval" step decides the check, so this step never changes
      # it. On a full run it fails the job when no case was scored without an error (no results,
      # or every case errored; evals/report.py exits 2 or 3) or the summary cannot be built (1),
      # never on a score: on 2026-10-26 a rejected key left all 65 cases unscored and the job green.
      - name: Summarise results
        if: always() && steps.keys.outputs.available == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          args=(--outcome "$RUN_OUTCOME")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args+=(--changed-files changed-files.txt)
          else
            args+=(--not-a-gate)
          fi
          uv run python -m evals.report results "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.keys.outputs.available == 'true'
        with:
          name: deepeval-results
          path: results/
          if-no-files-found: ignore
