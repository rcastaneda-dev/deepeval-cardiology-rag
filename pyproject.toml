[project]
name = "cardio-rag"
version = "0.1.0"
description = "A cardiology question-answering RAG app over US federal health documents, gated by DeepEval."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "deepeval==4.2.9",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
cardio = "cardio_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardio_rag"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "trafilatura>=2.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: the small stratified subset of eval cases that runs on every pull request",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
